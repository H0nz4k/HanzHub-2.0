services:
  grafana:
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /etc/hanzhub/grafana/datasource.yml:/etc/grafana/provisioning/datasources/hanzhub.yml:ro
      - /etc/hanzhub/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/hanzhub.yml:ro
      - /etc/hanzhub/grafana/meteo.json:/etc/grafana/hanzhub-dashboards/meteo.json:ro
