apiVersion: 1
datasources:
  - name: HUB2 Meteo InfluxDB
    uid: hub2-meteo-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: false
    jsonData:
      version: Flux
      organization: vysilac_v3
      defaultBucket: meteo
    secureJsonData:
      token: __INFLUX_READ_TOKEN__
